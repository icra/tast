<!doctype html><html><head>
  <meta charset=utf8>
  <title>Selector lloc GLOPS</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head><body>
<h1>Selector lloc GLOPS</h1>
<div id=app>
  <table border=1 style="font-size:x-large">
    <tr v-for="lloc in llocs">
      <td>
        {{lloc}}
      </td>
      <td style="padding:1em 1.618em">
        <a :href="`index.html?lloc=${lloc}`">
          https://tast.icradev.cat/glops/?lloc={{lloc}}
        </a>
      </td>
    </tr>
  </table>
</div>
<script>
  let app=Vue.createApp({
    data(){return{
      llocs:[
        "Museu Darder Banyoles",
        "Aigües de Manresa",
        "Nit de la Recerca",
      ],
    }},
  }).mount("#app");
</script>
